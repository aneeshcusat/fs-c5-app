<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" role="img" aria-label="Neetu Mohanan">
  <defs>
    <linearGradient id="emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f7a5c"/>
      <stop offset="100%" stop-color="#5ec4a0"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9a7848"/>
      <stop offset="50%" stop-color="#c4a265"/>
      <stop offset="100%" stop-color="#e4d5b5"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- Outer gold frame -->
  <rect x="4" y="4" width="72" height="72" rx="14" fill="none" stroke="url(#gold)" stroke-width="2"/>
  <rect x="8" y="8" width="64" height="64" rx="11" fill="url(#emerald)"/>
  <rect x="8" y="8" width="64" height="32" rx="11" fill="url(#shine)"/>
  <!-- Inner gold accent corner marks -->
  <path d="M16 16h8M16 16v8M64 16h-8M64 16v8M16 64h8M16 64v-8M64 64h-8M64 64v-8" stroke="#e4d5b5" stroke-width="1.2" stroke-linecap="round" opacity="0.7"/>
  <!-- Interlocked N M monogram -->
  <text x="40" y="52" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="500" fill="#ffffff" letter-spacing="-2">NM</text>
  <!-- Gold underline flourish -->
  <path d="M22 58h36" stroke="url(#gold)" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="40" cy="58" r="2" fill="#e4d5b5"/>
</svg>

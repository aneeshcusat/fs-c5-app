# Production configuration for tracopus.com

upstream tracopus_com_backend {
    server 127.0.0.1:4102;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name tracopus.com;

    access_log /var/log/nginx/tracopus.com.access.log;
    error_log /var/log/nginx/tracopus.com.error.log warn;

    include /etc/nginx/snippets/security-headers.conf;

    # Normalize /api to /api/
    location = /api {
        return 308 /api/;
    }

    # Every URL beginning with /api/ is sent to this hostname's backend.
    location ^~ /api/ {
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;

        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_buffering off;

        # Preserves /api/... in the upstream request URI.
        proxy_pass http://tracopus_com_backend;
    }

    root /etc/inflecaapp/tracopus.com/current;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ /\. {
        deny all;
    }

    location = /nginx-health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "nginx-ok\n";
    }
}


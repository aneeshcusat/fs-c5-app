<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Tracopus operating model</title>
  <desc id="desc">Five connected domains around a Work Graph core: People, Projects, Finance, Payroll, and Platform.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#10231c"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <circle cx="640" cy="360" r="210" fill="none" stroke="#1f3d36" stroke-width="1.5"/>
  <circle cx="640" cy="360" r="150" fill="none" stroke="#245247" stroke-width="1"/>
  <g filter="url(#soft)">
    <circle cx="640" cy="360" r="78" fill="url(#core)" opacity="0.95"/>
  </g>
  <text x="640" y="348" text-anchor="middle" fill="#ecfdf5" font-family="Georgia, serif" font-size="22" font-weight="700">Work Graph</text>
  <text x="640" y="376" text-anchor="middle" fill="#d1fae5" font-family="Inter, Arial, sans-serif" font-size="13">shared truth</text>

  <g font-family="Inter, Arial, sans-serif">
    <rect x="90" y="92" width="250" height="126" rx="10" fill="#111827" stroke="#2dd4bf" stroke-opacity="0.35"/>
    <text x="215" y="128" text-anchor="middle" fill="#99f6e4" font-size="14" letter-spacing="1">PEOPLE / HRMS</text>
    <text x="215" y="156" text-anchor="middle" fill="#e5e7eb" font-size="13">ATS · LMS · Benefits</text>
    <text x="215" y="178" text-anchor="middle" fill="#9ca3af" font-size="12">Onboarding · Leave · 360</text>

    <rect x="940" y="92" width="250" height="126" rx="10" fill="#111827" stroke="#2dd4bf" stroke-opacity="0.35"/>
    <text x="1065" y="128" text-anchor="middle" fill="#99f6e4" font-size="14" letter-spacing="1">PROJECTS / PSA</text>
    <text x="1065" y="156" text-anchor="middle" fill="#e5e7eb" font-size="13">Gantt · Risks · NPD</text>
    <text x="1065" y="178" text-anchor="middle" fill="#9ca3af" font-size="12">Dossiers · Resources</text>

    <rect x="940" y="502" width="250" height="126" rx="10" fill="#111827" stroke="#2dd4bf" stroke-opacity="0.35"/>
    <text x="1065" y="538" text-anchor="middle" fill="#99f6e4" font-size="14" letter-spacing="1">FINANCE</text>
    <text x="1065" y="566" text-anchor="middle" fill="#e5e7eb" font-size="13">Billing · Rev-Rec</text>
    <text x="1065" y="588" text-anchor="middle" fill="#9ca3af" font-size="12">Credit notes · Vendor</text>

    <rect x="90" y="502" width="250" height="126" rx="10" fill="#111827" stroke="#2dd4bf" stroke-opacity="0.35"/>
    <text x="215" y="538" text-anchor="middle" fill="#99f6e4" font-size="14" letter-spacing="1">PAYROLL</text>
    <text x="215" y="566" text-anchor="middle" fill="#e5e7eb" font-size="13">Runs · Paychecks</text>
    <text x="215" y="588" text-anchor="middle" fill="#9ca3af" font-size="12">Expenses · Benefits</text>

    <rect x="515" y="40" width="250" height="92" rx="10" fill="#111827" stroke="#2dd4bf" stroke-opacity="0.35"/>
    <text x="640" y="76" text-anchor="middle" fill="#99f6e4" font-size="14" letter-spacing="1">PLATFORM</text>
    <text x="640" y="102" text-anchor="middle" fill="#e5e7eb" font-size="13">Approvals · AI · Portal · SSO</text>
  </g>

  <g stroke="#34d399" stroke-opacity="0.35" stroke-width="1.5" fill="none">
    <path d="M340 155 C430 190 500 260 565 320"/>
    <path d="M940 155 C850 190 780 260 715 320"/>
    <path d="M940 565 C850 530 780 460 715 400"/>
    <path d="M340 565 C430 530 500 460 565 400"/>
    <path d="M640 132 C640 180 640 230 640 282"/>
  </g>

  <text x="640" y="680" text-anchor="middle" fill="#6ee7b7" font-family="Inter, Arial, sans-serif" font-size="14" letter-spacing="2">HIRE ’ STAFF ’ DELIVER ’ BILL ’ PAY ’ LEARN</text>
</svg>

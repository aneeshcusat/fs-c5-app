<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <!-- Professional Blue/Teal Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0891b2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="bgGrad" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#0891b2;stop-opacity:0.05" />
    </radialGradient>
    
    <!-- Glow effect -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Shadow -->
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- Background circle with subtle gradient -->
  <circle cx="100" cy="100" r="96" fill="url(#bgGrad)"/>
  
  <!-- Main Icon: Modern "T" integrated with developer tools -->
  <g filter="url(#glow)">
    
    <!-- Top bar of T - styled as a code bracket/terminal -->
    <rect x="55" y="55" width="90" height="20" rx="10" fill="url(#primaryGrad)" filter="url(#shadow)"/>
    <!-- Code bracket accent on top bar -->
    <path d="M 60 60 L 65 60 L 65 70 L 60 70" fill="white" opacity="0.9"/>
    <path d="M 135 60 L 140 60 L 140 70 L 135 70" fill="white" opacity="0.9"/>
    
    <!-- Vertical bar of T - styled as a tool/terminal -->
    <rect x="90" y="55" width="20" height="90" rx="10" fill="url(#primaryGrad)" filter="url(#shadow)"/>
    
    <!-- Developer tool symbols integrated into the T -->
    
    <!-- Left side: Code brackets -->
    <g transform="translate(30, 75)">
      <path d="M 0 0 L 8 0 L 8 20 L 0 20 Z" fill="url(#accentGrad)" opacity="0.85"/>
      <path d="M 2 4 L 2 16 M 6 4 L 6 16" stroke="white" stroke-width="1.5" opacity="0.9"/>
      <path d="M 2 4 L 4 6 L 2 8 M 6 4 L 4 6 L 6 8" stroke="white" stroke-width="1.2" opacity="0.9" fill="none"/>
    </g>
    
    <!-- Right side: Terminal/Console -->
    <g transform="translate(162, 75)">
      <rect x="0" y="0" width="8" height="20" rx="2" fill="url(#accentGrad)" opacity="0.85"/>
      <circle cx="2" cy="5" r="1" fill="white" opacity="0.9"/>
      <circle cx="4" cy="5" r="1" fill="white" opacity="0.9"/>
      <circle cx="6" cy="5" r="1" fill="white" opacity="0.9"/>
      <rect x="1" y="9" width="6" height="1.5" rx="0.5" fill="white" opacity="0.9"/>
      <rect x="1" y="12" width="4" height="1.5" rx="0.5" fill="white" opacity="0.9"/>
      <rect x="1" y="15" width="5" height="1.5" rx="0.5" fill="white" opacity="0.9"/>
    </g>
    
    <!-- Bottom left: Database/Server icon -->
    <g transform="translate(30, 125)">
      <ellipse cx="4" cy="2" rx="4" ry="2" fill="url(#accentGrad)" opacity="0.85"/>
      <rect x="0" y="2" width="8" height="12" rx="1" fill="url(#accentGrad)" opacity="0.85"/>
      <ellipse cx="4" cy="14" rx="4" ry="2" fill="url(#accentGrad)" opacity="0.85"/>
      <line x1="2" y1="5" x2="2" y2="11" stroke="white" stroke-width="0.8" opacity="0.8"/>
      <line x1="6" y1="5" x2="6" y2="11" stroke="white" stroke-width="0.8" opacity="0.8"/>
    </g>
    
    <!-- Bottom right: API/Network icon -->
    <g transform="translate(162, 125)">
      <circle cx="4" cy="8" r="3.5" fill="none" stroke="url(#accentGrad)" stroke-width="1.5" opacity="0.85"/>
      <circle cx="1" cy="4" r="1.8" fill="url(#accentGrad)" opacity="0.85"/>
      <circle cx="7" cy="4" r="1.8" fill="url(#accentGrad)" opacity="0.85"/>
      <circle cx="1" cy="12" r="1.8" fill="url(#accentGrad)" opacity="0.85"/>
      <circle cx="7" cy="12" r="1.8" fill="url(#accentGrad)" opacity="0.85"/>
      <line x1="2.5" y1="5.5" x2="3.5" y2="7" stroke="white" stroke-width="0.8" opacity="0.7"/>
      <line x1="5.5" y1="7" x2="4.5" y2="8.5" stroke="white" stroke-width="0.8" opacity="0.7"/>
      <line x1="2.5" y1="10.5" x2="3.5" y2="9" stroke="white" stroke-width="0.8" opacity="0.7"/>
      <line x1="5.5" y1="9" x2="4.5" y2="7.5" stroke="white" stroke-width="0.8" opacity="0.7"/>
    </g>
    
    <!-- Center accent: Small tool icon in the middle of T -->
    <g transform="translate(96, 96)">
      <rect x="0" y="0" width="8" height="8" rx="1.5" fill="white" opacity="0.2"/>
      <path d="M 2 2 L 6 2 L 6 6 L 2 6 Z" fill="none" stroke="white" stroke-width="1" opacity="0.6"/>
      <circle cx="4" cy="4" r="1" fill="white" opacity="0.6"/>
    </g>
  </g>
  
  <!-- Subtle decorative elements -->
  <circle cx="100" cy="25" r="2.5" fill="url(#accentGrad)" opacity="0.6"/>
  <circle cx="100" cy="175" r="2.5" fill="url(#accentGrad)" opacity="0.6"/>
  
  <!-- Modern geometric accent lines -->
  <g opacity="0.08">
    <line x1="25" y1="100" x2="50" y2="100" stroke="url(#primaryGrad)" stroke-width="1"/>
    <line x1="150" y1="100" x2="175" y2="100" stroke="url(#primaryGrad)" stroke-width="1"/>
    <line x1="100" y1="25" x2="100" y2="50" stroke="url(#primaryGrad)" stroke-width="1"/>
    <line x1="100" y1="150" x2="100" y2="175" stroke="url(#primaryGrad)" stroke-width="1"/>
  </g>
</svg>

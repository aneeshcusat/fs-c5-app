<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hash Generator - Tecopus</title>
    <link rel="icon" type="image/svg+xml" href="../../shared/icon.svg">
    <link rel="alternate icon" href="../../shared/favicon.ico">
    <link rel="apple-touch-icon" href="../../shared/icon.svg">
    <link rel="stylesheet" href="../../shared/styles.css">
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <div class="header-content">
                <a href="../../index.html" style="text-decoration: none; color: inherit; display: flex; align-items: center; gap: 0.75rem;">
                    <img src="../../shared/icon.svg" alt="Tecopus" style="width: 32px; height: 32px; flex-shrink: 0;">
                    <h1 class="logo">Tecopus</h1>
                </a>
                <div class="header-actions">
                    <button class="btn-icon" id="themeToggle" title="Toggle Dark Mode">
                        <span class="icon">🌙</span>
                    </button>
                    <button class="btn-icon" id="helpBtn" title="Help & Shortcuts">
                        <span class="icon">?</span>
                    </button>
                </div>
            </div>
        </header>

        <main class="tool-container">
            <div class="tool-header">
                <h1>🔐 Hash Generator</h1>
            </div>

            <div class="tool-content">
                <div id="statusMessage"></div>

                <div class="toolbar">
                    <div class="toolbar-group">
                        <select id="hashType" style="padding: 0.75rem 1rem; border: 2px solid var(--border-color); border-radius: var(--border-radius-sm); background: var(--bg-primary); color: var(--text-primary); font-weight: 600; font-size: 0.875rem; cursor: pointer;">
                            <option value="md5">MD5</option>
                            <option value="sha1">SHA-1</option>
                            <option value="sha256">SHA-256</option>
                            <option value="sha512">SHA-512</option>
                        </select>
                        <button class="btn btn-primary" id="generateBtn">Generate Hash</button>
                    </div>
                    <div class="toolbar-group">
                        <button class="btn btn-secondary" id="copyBtn">Copy</button>
                        <input type="file" id="fileInput" style="display: none;">
                        <button class="btn btn-secondary" id="loadFileBtn">Hash File</button>
                    </div>
                </div>

                <div class="tool-grid">
                    <div class="editor-wrapper">
                        <div class="editor-header">
                            <span class="editor-title">Input Text</span>
                        </div>
                        <div class="drop-zone">
                            <textarea id="inputText" placeholder="Enter text to hash..."></textarea>
                        </div>
                    </div>

                    <div class="editor-wrapper">
                        <div class="editor-header">
                            <span class="editor-title">Hash Output</span>
                        </div>
                        <div class="drop-zone">
                            <textarea id="hashOutput" readonly placeholder="Hash will appear here..."></textarea>
                        </div>
                    </div>
                </div>

                <div class="editor-wrapper">
                    <div class="editor-header">
                        <span class="editor-title">Hash Information</span>
                    </div>
                    <div class="drop-zone">
                        <div class="output-area" id="hashInfo" style="min-height: 150px; border: none; background: var(--bg-primary);"></div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/crypto-js@4.1.1/crypto-js.js"></script>
    <script src="../../shared/app.js"></script>
    <script src="app.js"></script>
</body>
</html>

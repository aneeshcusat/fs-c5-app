<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Generator - Tecopus</title>
    <link rel="icon" type="image/svg+xml" href="../../shared/icon.svg">
    <link rel="alternate icon" href="../../shared/favicon.ico">
    <link rel="apple-touch-icon" href="../../shared/icon.svg">
    <link rel="stylesheet" href="../../shared/styles.css">
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <div class="header-content">
                <a href="../../index.html" style="text-decoration: none; color: inherit; display: flex; align-items: center; gap: 0.75rem;">
                    <img src="../../shared/icon.svg" alt="Tecopus" style="width: 32px; height: 32px; flex-shrink: 0;">
                    <h1 class="logo">Tecopus</h1>
                </a>
                <div class="header-actions">
                    <button class="btn-icon" id="themeToggle" title="Toggle Dark Mode">
                        <span class="icon">🌙</span>
                    </button>
                    <button class="btn-icon" id="helpBtn" title="Help & Shortcuts">
                        <span class="icon">?</span>
                    </button>
                </div>
            </div>
        </header>

        <main class="tool-container">
            <div class="tool-header">
                <h1>🔑 Password Generator</h1>
            </div>

            <div class="tool-content">
                <div id="statusMessage"></div>

                <div class="toolbar">
                    <div class="toolbar-group">
                        <label style="display: flex; align-items: center; gap: 0.5rem; font-size: 0.875rem;">Length: 
                            <input type="number" id="lengthInput" value="16" min="4" max="128" style="width: 80px; padding: 0.5rem; border: 2px solid var(--border-color); border-radius: var(--border-radius-sm); background: var(--bg-primary); color: var(--text-primary); font-weight: 600;">
                        </label>
                        <button class="btn btn-primary" id="generateBtn">Generate</button>
                    </div>
                    <div class="toolbar-group">
                        <button class="btn btn-secondary" id="copyBtn">Copy</button>
                        <button class="btn btn-secondary" id="generateMultipleBtn">Generate 10</button>
                    </div>
                </div>

                <div class="editor-wrapper" style="margin-bottom: 1rem;">
                    <div class="editor-header">
                        <span class="editor-title">Password Options</span>
                    </div>
                    <div class="drop-zone" style="padding: 1rem; background: var(--bg-primary); display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 0.75rem;">
                        <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer; font-size: 0.875rem;">
                            <input type="checkbox" id="includeUppercase" checked> Include Uppercase (A-Z)
                        </label>
                        <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer; font-size: 0.875rem;">
                            <input type="checkbox" id="includeLowercase" checked> Include Lowercase (a-z)
                        </label>
                        <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer; font-size: 0.875rem;">
                            <input type="checkbox" id="includeNumbers" checked> Include Numbers (0-9)
                        </label>
                        <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer; font-size: 0.875rem;">
                            <input type="checkbox" id="includeSymbols" checked> Include Symbols (!@#$%^&*)
                        </label>
                        <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer; font-size: 0.875rem;">
                            <input type="checkbox" id="excludeSimilar"> Exclude Similar Characters
                        </label>
                        <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer; font-size: 0.875rem;">
                            <input type="checkbox" id="excludeAmbiguous"> Exclude Ambiguous Characters
                        </label>
                    </div>
                </div>

                <div class="editor-wrapper">
                    <div class="editor-header">
                        <span class="editor-title">Generated Password(s)</span>
                    </div>
                    <div class="drop-zone">
                        <textarea id="passwordOutput" readonly placeholder="Generated passwords will appear here..."></textarea>
                    </div>
                </div>

                <div class="editor-wrapper">
                    <div class="editor-header">
                        <span class="editor-title">Password Strength</span>
                    </div>
                    <div class="drop-zone">
                        <div class="output-area" id="strengthInfo" style="border: none; background: var(--bg-primary); min-height: 150px;"></div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="../../shared/app.js"></script>
    <script src="app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SQL Formatter - Tecopus</title>
    <link rel="icon" type="image/svg+xml" href="../../shared/icon.svg">
    <link rel="alternate icon" href="../../shared/favicon.ico">
    <link rel="apple-touch-icon" href="../../shared/icon.svg">
    <link rel="stylesheet" href="../../shared/styles.css">
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <div class="header-content">
                <a href="../../index.html" style="text-decoration: none; color: inherit; display: flex; align-items: center; gap: 0.75rem;">
                    <img src="../../shared/icon.svg" alt="Tecopus" style="width: 32px; height: 32px; flex-shrink: 0;">
                    <h1 class="logo">Tecopus</h1>
                </a>
                <div class="header-actions">
                    <button class="btn-icon" id="themeToggle" title="Toggle Dark Mode">
                        <span class="icon">🌙</span>
                    </button>
                    <button class="btn-icon" id="helpBtn" title="Help & Shortcuts">
                        <span class="icon">?</span>
                    </button>
                </div>
            </div>
        </header>

        <main class="tool-container">
            <div class="tool-header">
                <h1>✨ SQL Formatter</h1>
            </div>

            <div class="tool-content">
                <div id="statusMessage"></div>

                <div class="toolbar">
                    <div class="toolbar-group">
                        <button class="btn btn-primary" id="formatBtn">Format SQL</button>
                        <button class="btn btn-secondary" id="minifyBtn">Minify</button>
                        <button class="btn btn-success" id="validateBtn">Validate</button>
                    </div>
                    <div class="toolbar-group">
                        <button class="btn btn-secondary" id="copyBtn">Copy</button>
                        <button class="btn btn-secondary" id="downloadBtn">Download</button>
                    </div>
                    <div class="toolbar-group">
                        <input type="file" id="fileInput" accept=".sql" style="display: none;">
                        <button class="btn btn-secondary" id="loadFileBtn">Load File</button>
                    </div>
                </div>

                <div class="tool-grid">
                    <div class="editor-wrapper">
                        <div class="editor-header">
                            <span class="editor-title">SQL Query</span>
                        </div>
                        <div class="drop-zone">
                            <textarea id="sqlInput" placeholder="Enter your SQL query...&#10;&#10;Example:&#10;SELECT u.id, u.name, COUNT(o.id) as order_count FROM users u LEFT JOIN orders o ON u.id = o.user_id WHERE u.active = 1 GROUP BY u.id, u.name ORDER BY order_count DESC LIMIT 10;"></textarea>
                        </div>
                    </div>

                    <div class="editor-wrapper">
                        <div class="editor-header">
                            <span class="editor-title">Formatted SQL</span>
                        </div>
                        <div class="drop-zone">
                            <textarea id="sqlOutput" readonly placeholder="Formatted SQL will appear here..."></textarea>
                        </div>
                    </div>
                </div>

                <div class="editor-wrapper" id="validationResults" style="display: none;">
                    <div class="editor-header">
                        <span class="editor-title">Validation Results</span>
                    </div>
                    <div class="drop-zone">
                        <div class="output-area" id="validationOutput" style="min-height: 150px; border: none; background: var(--bg-primary);"></div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sql-formatter@15.0.0/dist/sql-formatter.min.js"></script>
    <script src="../../shared/app.js"></script>
    <script src="app.js"></script>
</body>
</html>

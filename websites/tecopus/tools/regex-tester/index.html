<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Regex Tester & Visualizer - Tecopus</title>
    <link rel="icon" type="image/svg+xml" href="../../shared/icon.svg">
    <link rel="alternate icon" href="../../shared/favicon.ico">
    <link rel="apple-touch-icon" href="../../shared/icon.svg">
    <link rel="stylesheet" href="../../shared/styles.css">
    <style>
        .regex-input-group {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }
        .regex-flags {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            margin-bottom: 1rem;
        }
        .flag-checkbox {
            display: flex;
            align-items: center;
            gap: 0.25rem;
        }
        .match-results {
            margin-top: 1rem;
        }
        .match-item {
            padding: 0.5rem;
            margin: 0.25rem 0;
            background: var(--bg-tertiary);
            border-radius: var(--border-radius);
            border-left: 3px solid var(--primary-color);
        }
        .match-highlight {
            background: rgba(99, 102, 241, 0.3);
            padding: 2px 4px;
            border-radius: 2px;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <div class="header-content">
                <a href="../../index.html" style="text-decoration: none; color: inherit; display: flex; align-items: center; gap: 0.75rem;">
                    <img src="../../shared/icon.svg" alt="Tecopus" style="width: 32px; height: 32px; flex-shrink: 0;">
                    <h1 class="logo">Tecopus</h1>
                </a>
                <div class="header-actions">
                    <button class="btn-icon" id="themeToggle" title="Toggle Dark Mode">
                        <span class="icon">🌙</span>
                    </button>
                    <button class="btn-icon" id="helpBtn" title="Help & Shortcuts">
                        <span class="icon">?</span>
                    </button>
                </div>
            </div>
        </header>

        <main class="tool-container">
            <div class="tool-header">
                <h1>🧪 Regex Tester & Visualizer</h1>
            </div>

            <div class="tool-content">
                <div id="statusMessage"></div>

                <div class="toolbar">
                    <div class="toolbar-group">
                        <input type="text" id="regexInput" placeholder="Enter regex pattern (e.g., /pattern/flags)" style="font-family: var(--font-mono); padding: 0.75rem 1rem; border: 2px solid var(--border-color); border-radius: var(--border-radius-sm); background: var(--bg-primary); color: var(--text-primary); font-size: 0.875rem; min-width: 300px;">
                        <button class="btn btn-primary" id="testBtn">Test</button>
                    </div>
                    <div class="toolbar-group">
                        <label class="flag-checkbox" style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer; font-size: 0.875rem;">
                            <input type="checkbox" id="flagG" checked> Global (g)
                        </label>
                        <label class="flag-checkbox" style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer; font-size: 0.875rem;">
                            <input type="checkbox" id="flagI"> Case Insensitive (i)
                        </label>
                        <label class="flag-checkbox" style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer; font-size: 0.875rem;">
                            <input type="checkbox" id="flagM"> Multiline (m)
                        </label>
                        <label class="flag-checkbox" style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer; font-size: 0.875rem;">
                            <input type="checkbox" id="flagS"> Dot All (s)
                        </label>
                        <label class="flag-checkbox" style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer; font-size: 0.875rem;">
                            <input type="checkbox" id="flagU"> Unicode (u)
                        </label>
                        <label class="flag-checkbox" style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer; font-size: 0.875rem;">
                            <input type="checkbox" id="flagY"> Sticky (y)
                        </label>
                    </div>
                </div>

                <div class="editor-wrapper">
                    <div class="editor-header">
                        <span class="editor-title">Test Text</span>
                    </div>
                    <div class="drop-zone">
                        <textarea id="testText" placeholder="Enter text to test against the regex pattern..."></textarea>
                    </div>
                </div>

                <div class="tool-grid">
                    <div class="editor-wrapper">
                        <div class="editor-header">
                            <span class="editor-title">Match Results</span>
                        </div>
                        <div class="drop-zone">
                            <div class="output-area" id="matchResults" style="border: none; background: var(--bg-primary); flex: 1;"></div>
                        </div>
                    </div>

                    <div class="editor-wrapper">
                        <div class="editor-header">
                            <span class="editor-title">Match Visualization</span>
                        </div>
                        <div class="drop-zone">
                            <div class="output-area" id="matchVisualization" style="font-family: var(--font-mono); white-space: pre-wrap; border: none; background: var(--bg-primary); flex: 1;"></div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="../../shared/app.js"></script>
    <script src="app.js"></script>
</body>
</html>
